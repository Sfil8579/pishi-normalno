name: Улучшение
description: Предложить новый режим, интеграцию или проверку
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему нужно решить
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Реальный сценарий
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Ограничения и ложные срабатывания
