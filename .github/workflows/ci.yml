name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python tools/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: mypy skills/pishi-normalno/scripts tools tests
      - run: python -m build
      - run: python tools/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: pishi-normalno-skill
          path: |
            dist/pishi-normalno.zip
            dist/checksums.txt
            dist/pishi-normalno.manifest.json

  python-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: pishi-normalno doctor
      - run: python -m unittest discover -s tests -v

  installers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bash syntax and dry run
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          ./install.sh --target agents --dry-run
      - name: PowerShell dry run
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Target agents -DryRun
