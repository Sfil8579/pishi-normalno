name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python tools/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: mypy skills/pishi-normalno/scripts tools tests
      - run: python tools/package_skill.py
      - run: python -m build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/pishi-normalno.zip
          dist/checksums.txt
          dist/pishi-normalno.manifest.json
          dist/*.whl
          dist/*.tar.gz
          --generate-notes
          --verify-tag
          --title "Пиши нормально ${{ github.ref_name }}"
